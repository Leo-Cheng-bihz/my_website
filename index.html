<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr. Newton</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #111827;
        --panel: rgba(15, 23, 42, 0.7);
        --primary: #7dd3fc;
        --accent: #a78bfa;
        --text: #e2e8f0;
        --muted: #cbd5e1;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg-1) 40%, var(--bg-2) 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .hero {
        width: min(680px, 100%);
        background: var(--panel);
        border: 1px solid rgba(125, 211, 252, 0.25);
        border-radius: 24px;
        padding: 48px 32px;
        text-align: center;
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(10px);
      }

      .badge {
        display: inline-block;
        letter-spacing: 0.18em;
        font-size: 12px;
        text-transform: uppercase;
        color: var(--primary);
        border: 1px solid rgba(125, 211, 252, 0.45);
        border-radius: 999px;
        padding: 10px 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 5rem);
        line-height: 1;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      p {
        margin: 18px auto 0;
        max-width: 520px;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .cta {
        display: inline-block;
        margin-top: 32px;
        padding: 16px 32px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: #020817;
        font-weight: 700;
        font-size: 1rem;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 15px 35px rgba(125, 211, 252, 0.28);
      }

      .cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 40px rgba(167, 139, 250, 0.35);
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <div class="badge">MR. NEWTON</div>
      <h1>Mr. Newton</h1>
      <p>Welcome to the official Mr. Newton landing page. Click below to visit the website.</p>
      <a class="cta" href="https://beta.geo-fs.com/geofs.php?a=22" target="_blank" rel="noopener noreferrer">Go to website</a>
    </main>
  </body>
</html>
